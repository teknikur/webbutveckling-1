<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Clicker</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body onkeypress="(plusOne(count))">
    <div>
        <span id="count">0</span>
        <span id="word" class="word"></span>
    </div>
    <div>
        <button id="btnMain" class="btnMain" onclick="plusOne(count)"; onkeypress="(plusOne(count))">
            +
        </button>
    </div>
    
</body>
</html>
